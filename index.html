        // Applies the foreground mask as the alpha channel of mat,
        // making background pixels fully transparent.
        function applyForegroundMask(mat, mask) {
            let maskScaled = new cv.Mat();
            if (mask.cols !== mat.cols || mask.rows !== mat.rows) {
                cv.resize(mask, maskScaled, new cv.Size(mat.cols, mat.rows), 0, 0, cv.INTER_NEAREST);
            } else {
                mask.copyTo(maskScaled);
            }

            // Close holes and dilate slightly to fill gaps around edges
            let kernel = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(9, 9));
            cv.morphologyEx(maskScaled, maskScaled, cv.MORPH_CLOSE, kernel);
            cv.dilate(maskScaled, maskScaled, kernel);
            kernel.delete();

            // Soft edge: blur the mask so the person doesn't have a hard cutout edge
            cv.GaussianBlur(maskScaled, maskScaled, new cv.Size(15, 15), 0);

            // Write mask values into the alpha channel of mat
            const data = mat.data;
            const maskData = maskScaled.data;
            for (let i = 0; i < maskData.length; i++) {
                data[i * 4 + 3] = maskData[i];
            }

            maskScaled.delete();
        }

        function pixelate(src, fgMask) {
            // Scale source up to output size
            let fullSize = new cv.Mat();
            cv.resize(src, fullSize, new cv.Size(OUTPUT_SIZE, OUTPUT_SIZE), 0, 0, cv.INTER_LINEAR);

            // Convert to grayscale for tone sampling
            let grayMat = new cv.Mat();
            cv.cvtColor(fullSize, grayMat, cv.COLOR_RGBA2GRAY);

            // Scale and clean up foreground mask to output size
            let maskScaled = new cv.Mat();
            cv.resize(fgMask, maskScaled, new cv.Size(OUTPUT_SIZE, OUTPUT_SIZE), 0, 0, cv.INTER_NEAREST);
            let kernel = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(9, 9));
            cv.morphologyEx(maskScaled, maskScaled, cv.MORPH_CLOSE, kernel);
            cv.dilate(maskScaled, maskScaled, kernel);
            kernel.delete();

            // #f2f2f2 background canvas
            dst = new cv.Mat(OUTPUT_SIZE, OUTPUT_SIZE, cv.CV_8UC4);
            dst.setTo(new cv.Scalar(242, 242, 242, 255));

            for (let y = 0; y < OUTPUT_SIZE; y += pixelSize) {
                for (let x = 0; x < OUTPUT_SIZE; x += pixelSize) {
                    const endY = Math.min(y + pixelSize, OUTPUT_SIZE);
                    const endX = Math.min(x + pixelSize, OUTPUT_SIZE);

                    // Average brightness and foreground coverage of this square
                    let sum = 0, fgSum = 0, count = 0;
                    for (let dy = y; dy < endY; dy++) {
                        for (let dx = x; dx < endX; dx++) {
                            sum   += grayMat.data[dy * OUTPUT_SIZE + dx];
                            fgSum += maskScaled.data[dy * OUTPUT_SIZE + dx];
                            count++;
                        }
                    }

                    // Skip background squares — leave them as #f2f2f2
                    if (fgSum / count < 128) continue;

                    // Map average brightness to 3 tones: black / gray / white
                    const avg = sum / count;
                    let tone;
                    if (avg < 85)       tone = 0;
                    else if (avg < 170) tone = 128;
                    else                tone = 255;

                    cv.rectangle(
                        dst,
                        new cv.Point(x, y),
                        new cv.Point(endX - 1, endY - 1),
                        new cv.Scalar(tone, tone, tone, 255),
                        -1
                    );
                }
            }

            fullSize.delete();
            grayMat.delete();
            maskScaled.delete();
            return dst;
        }

        function cartoon(src) {
            let gray = new cv.Mat();
            let edges = new cv.Mat();
            let temp = new cv.Mat();

            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            cv.medianBlur(gray, gray, 3);

            cv.adaptiveThreshold(
                gray,
                edges,
                255,
                cv.ADAPTIVE_THRESH_MEAN_C,
                cv.THRESH_BINARY,
                9,
                5
            );

            cv.GaussianBlur(src, temp, new cv.Size(3, 3), 0);
            cv.cvtColor(edges, edges, cv.COLOR_GRAY2RGBA);

            cv.bitwise_and(src, edges, dst);

            // gray.delete();
            // edges.delete();


            return dst;
        }

        function colorize(src) {
            const intensity = 30;

            let gray = new cv.Mat();
            let dst = src.clone();

            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

            for (let i = 0; i < gray.data.length; i++) {
                let v = gray.data[i];

                let r = Math.max(0, Math.min(255, 2 * v - 128));
                let g = Math.max(0, Math.min(255, 2 * (255 - Math.abs(v - 128))));
                let b = Math.max(0, Math.min(255, 255 - 2 * v));

                let idx = i * 4;

                dst.data[idx] = dst.data[idx] * (1 - intensity) + r * intensity;
                dst.data[idx + 1] = dst.data[idx + 1] * (1 - intensity) + g * intensity;
                dst.data[idx + 2] = dst.data[idx + 2] * (1 - intensity) + b * intensity;
            }

            gray.delete();
            return dst;
        }

        async function processVideo() {
            if (!streaming) return;

            let begin = Date.now();

            // stats.begin();
            vc.read(src);

            // Build foreground mask from raw video frame before any filter
            let fgMask = new cv.Mat();
            bgSubtractor.apply(src, fgMask);

            switch (filter) {
                case "none":
                    applyOperation(passthrough);
                    break;
                case "gray":
                    applyOperation(gray);
                    break;
                case "canny":
                    applyOperation(cannyRainbow);
                    break;
                case "cartoon":
                    applyOperation(cartoon);
                    break;
                case "pixelate":
                    pixelate(src, fgMask);
                    break;
                default:
                    applyOperation(passthrough)

            }
            // Knock out the background via the foreground mask (not for pixelate — the halftone speaks for itself)
            if (filter !== "pixelate") {
                applyForegroundMask(dst, fgMask);
            }
            fgMask.delete();

            // Upscale to output canvas size (pixelate already outputs at OUTPUT_SIZE)
            if (dst.cols !== OUTPUT_SIZE || dst.rows !== OUTPUT_SIZE) {
                let displayMat = new cv.Mat();
                cv.resize(dst, displayMat, new cv.Size(OUTPUT_SIZE, OUTPUT_SIZE), 0, 0, cv.INTER_NEAREST);
                cv.imshow(outputCanvas, displayMat);
                displayMat.delete();
            } else {
                cv.imshow(outputCanvas, dst);
            }


            let delay = 1000 / FPS - (Date.now() - begin);
            setTimeout(processVideo, delay);
        }


        function applyOperation(operation) {
            return operation(src); // Execute the OpenCV function
        };
