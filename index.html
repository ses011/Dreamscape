        (function loadPixelTiles() {

                splitleft: 'assets/images/pixel-splitleft-1.png'
            };
            for (const [key, src] of Object.entries(map)) {
                const img = new Image();
                img.onload = () => { pixelTiles[key] = img; };
                img.src = src;
            }
        })();
        outputCanvas.width = OUTPUT_SIZE;
        outputCanvas.height = OUTPUT_SIZE;
        const FPS = 30;
        const outputFolder = "../images"

        let filter
        let cvReady = false;
        let width;
        let height;

        let src;
        let dst;
        let streaming;
        let bgSubtractor;

        function initSegmentation() {
            const seg = new SelfieSegmentation({
                locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`
            });
            seg.setOptions({ modelSelection: 1 });
            personMaskCanvas = document.createElement('canvas');
            personMaskCtx = personMaskCanvas.getContext('2d', { willReadFrequently: true });
            seg.onResults(results => {
                const w = results.segmentationMask.width;
                const h = results.segmentationMask.height;
                if (personMaskCanvas.width !== w) personMaskCanvas.width = w;
                if (personMaskCanvas.height !== h) personMaskCanvas.height = h;
                personMaskCtx.fillStyle = '#000';
                personMaskCtx.fillRect(0, 0, w, h);
                personMaskCtx.drawImage(results.segmentationMask, 0, 0);
                personMaskReady = true;
            });
            (async function loop() {
                if (streaming && video.readyState >= 2) {
                    await seg.send({ image: video });
                }
                requestAnimationFrame(loop);
            })();
        }

        function onOpenCvReady() {
            cv['onRuntimeInitialized'] = () => {
                console.log("OpenCV.js is ready.");
                cvReady = true;

                video = document.getElementById("videoInput");
                console.log(video)
                navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                    .then(function (stream) {
                        video.srcObject = stream;
                        video.play();
                        initSegmentation();
                    })
                    .catch(function (err) {
                        console.log("An error occurred! " + err);
                    });

                // console.log(video.videoHeight)
                // console.log(video)
                height = video.videoHeight;
                // console.log(height)
                width = video.videoWidth;
                // video.setAttribute('width', width);
                // video.setAttribute('height', height);
                // console.log(video)
                streaming = true;
                vc = new cv.VideoCapture(video);

                src = new cv.Mat(video.height, video.width, cv.CV_8UC4);
                dst = new cv.Mat(video.height, video.width, cv.CV_8UC4);
                filter = "pixelate"
                bgSubtractor = new cv.BackgroundSubtractorMOG2(500, 16, false);

                setTimeout(processVideo, 0);
                setTimeout(startCountdown, 2 * 60 * 1000);
            };
        }


        // Applies the foreground mask as the alpha channel of mat,
        // making background pixels fully transparent.
        function applyForegroundMask(mat, mask) {
            let maskScaled = new cv.Mat();
            if (mask.cols !== mat.cols || mask.rows !== mat.rows) {
                cv.resize(mask, maskScaled, new cv.Size(mat.cols, mat.rows), 0, 0, cv.INTER_NEAREST);
            } else {
                mask.copyTo(maskScaled);
            }

            // Close holes and dilate slightly to fill gaps around edges
            let kernel = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(9, 9));
            cv.morphologyEx(maskScaled, maskScaled, cv.MORPH_CLOSE, kernel);
            cv.dilate(maskScaled, maskScaled, kernel);
            kernel.delete();

            // Soft edge: blur the mask so the person doesn't have a hard cutout edge
            cv.GaussianBlur(maskScaled, maskScaled, new cv.Size(15, 15), 0);

            // Write mask values into the alpha channel of mat
            const data = mat.data;
            const maskData = maskScaled.data;
            for (let i = 0; i < maskData.length; i++) {
                data[i * 4 + 3] = maskData[i];
            }

            maskScaled.delete();
        }

        function gray(src) {
            cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY);
            // cv.flip(dst, 1, dst);
            return dst;
        }

        function passthrough(src) {
            dst = src.clone();
            return dst;
        }

            //   for (let x = 0; x < video.width; x++) {

            //     let angle = Math.atan2(gradY.ucharPtr(y, x), gradX.ucharPtr(y, x));

            //     let hue = (angle + Math.PI) / (Math.PI * 2) * 360
            //     // let col = color(hue, 100, constrain(magnitude, 0, 100));

            //     pixel[0] = hue;
            //     pixel[1] = 100;

            //     pixel[2] = 100



            //   }
            // }
            // console.log(`${dst.ucharPtr(299, 200)}\n\n`)
            // cv.bitwise_and(src, dst, dst);

            return dst;
        }


        function pixelate(src) {
            // Scale source to OUTPUT_SIZE for brightness sampling
            let fullSize = new cv.Mat();
            cv.resize(src, fullSize, new cv.Size(OUTPUT_SIZE, OUTPUT_SIZE), 0, 0, cv.INTER_LINEAR);
            let grayMat = new cv.Mat();
            cv.cvtColor(fullSize, grayMat, cv.COLOR_RGBA2GRAY);
            fullSize.delete();

            // Get person mask from MediaPipe scaled to OUTPUT_SIZE
            // Clear to black first — after draw: person=white (r=255), background=black (r=0)
            let personData = null;
            if (personMaskReady) {
                scaledMaskCtx.fillStyle = '#000';
                scaledMaskCtx.fillRect(0, 0, OUTPUT_SIZE, OUTPUT_SIZE);
                scaledMaskCtx.drawImage(personMaskCanvas, 0, 0, OUTPUT_SIZE, OUTPUT_SIZE);
                personData = scaledMaskCtx.getImageData(0, 0, OUTPUT_SIZE, OUTPUT_SIZE).data;
            }

            const ctx = outputCanvas.getContext('2d');
            ctx.fillStyle = '#01212C';
            ctx.fillRect(0, 0, OUTPUT_SIZE, OUTPUT_SIZE);

            // First pass: split duplicate drawn underneath
            if (showSplit && pixelTiles.splitleft && personData) {
                for (let y = 0; y < OUTPUT_SIZE; y += pixelSize) {
                    for (let x = 0; x < OUTPUT_SIZE; x += pixelSize) {
                        const endY = Math.min(y + pixelSize, OUTPUT_SIZE);
                        const endX = Math.min(x + pixelSize, OUTPUT_SIZE);

                        let pSum = 0, count = 0;
                        for (let dy = y; dy < endY; dy++) {
                            for (let dx = x; dx < endX; dx++) {
                                pSum += personData[(dy * OUTPUT_SIZE + dx) * 4];
                                count++;
                            }
                        }
                        if (pSum / count < 128) continue;

                        const drawX = x - splitOffset;
                        if (drawX + endX - x <= 0 || drawX >= OUTPUT_SIZE) continue;
                        ctx.drawImage(pixelTiles.splitleft, drawX, y, endX - x, endY - y);
                    }
                }
            }

            // Second pass: main pixel tones drawn on top
            for (let y = 0; y < OUTPUT_SIZE; y += pixelSize) {
                for (let x = 0; x < OUTPUT_SIZE; x += pixelSize) {
                    const endY = Math.min(y + pixelSize, OUTPUT_SIZE);
                    const endX = Math.min(x + pixelSize, OUTPUT_SIZE);

                    let brightnessSum = 0, personSum = 0, count = 0;
                    for (let dy = y; dy < endY; dy++) {
                        for (let dx = x; dx < endX; dx++) {
                            const i = dy * OUTPUT_SIZE + dx;
                            brightnessSum += grayMat.data[i];
                            if (personData) personSum += personData[i * 4];
                            count++;
                        }
                    }

                    if (!personData || personSum / count < 128) continue;

                    const avg = brightnessSum / count;
                    let tile;
                    if (avg < 64)       tile = pixelTiles.dark;
                    else if (avg < 120) tile = pixelTiles.mid;
                    else if (avg < 155) tile = pixelTiles.midlight;
                    else                tile = pixelTiles.light;

                    if (tile) ctx.drawImage(tile, x, y, endX - x, endY - y);
                }
            }

            grayMat.delete();
            dst = new cv.Mat(OUTPUT_SIZE, OUTPUT_SIZE, cv.CV_8UC4);
        }

        function cartoon(src) {
            let gray = new cv.Mat();
            let edges = new cv.Mat();
            let temp = new cv.Mat();

            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            cv.medianBlur(gray, gray, 3);

            cv.adaptiveThreshold(
                gray,
                edges,
                255,
                cv.ADAPTIVE_THRESH_MEAN_C,
                cv.THRESH_BINARY,
                9,
                5
            );

            cv.GaussianBlur(src, temp, new cv.Size(3, 3), 0);
            cv.cvtColor(edges, edges, cv.COLOR_GRAY2RGBA);

            cv.bitwise_and(src, edges, dst);

            // gray.delete();
            // edges.delete();


            return dst;
        }

        function colorize(src) {
            const intensity = 30;

            let gray = new cv.Mat();
            let dst = src.clone();

            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

            for (let i = 0; i < gray.data.length; i++) {
                let v = gray.data[i];

                let r = Math.max(0, Math.min(255, 2 * v - 128));
                let g = Math.max(0, Math.min(255, 2 * (255 - Math.abs(v - 128))));
                let b = Math.max(0, Math.min(255, 255 - 2 * v));

                let idx = i * 4;

                dst.data[idx] = dst.data[idx] * (1 - intensity) + r * intensity;
                dst.data[idx + 1] = dst.data[idx + 1] * (1 - intensity) + g * intensity;
                dst.data[idx + 2] = dst.data[idx + 2] * (1 - intensity) + b * intensity;
            }

            gray.delete();
            return dst;
        }

        async function processVideo() {
            if (!streaming) return;

            let begin = Date.now();

            // stats.begin();
            vc.read(src);

            // Build foreground mask from raw video frame before any filter
            let fgMask = new cv.Mat();
            bgSubtractor.apply(src, fgMask);

            switch (filter) {
                case "none":
                    applyOperation(passthrough);
                    break;
                case "gray":
                    applyOperation(gray);
                    break;
                case "canny":
                    applyOperation(cannyRainbow);
                    break;
                case "cartoon":
                    applyOperation(cartoon);
                    break;
                case "pixelate":
                    pixelate(src);
                    break;
                default:
                    applyOperation(passthrough)

            }
            // Knock out the background via the foreground mask (not for pixelate — the halftone speaks for itself)
            if (filter !== "pixelate") {
                applyForegroundMask(dst, fgMask);
            }
            fgMask.delete();

            // pixelate draws directly to the canvas 2D context — skip cv.imshow for it
            if (filter !== "pixelate") {
                if (dst.cols !== OUTPUT_SIZE || dst.rows !== OUTPUT_SIZE) {
                    let displayMat = new cv.Mat();
                    cv.resize(dst, displayMat, new cv.Size(OUTPUT_SIZE, OUTPUT_SIZE), 0, 0, cv.INTER_NEAREST);
                    cv.imshow(outputCanvas, displayMat);
                    displayMat.delete();
                } else {
                    cv.imshow(outputCanvas, dst);
                }
            }


            let delay = 1000 / FPS - (Date.now() - begin);
            setTimeout(processVideo, delay);
        }


        function applyOperation(operation) {
            return operation(src); // Execute the OpenCV function
        };

        function saveImage() {
            outputCanvas.toBlob((blob) => {
                let url = URL.createObjectURL(blob)
                const a = document.createElement('a')
                a.href = url;
                a.download = url
                document.body.appendChild(a)
                a.click()
                document.body.removeChild(a)
            });


            // TODO - send image to  API



            // const image = outputCanvas.toDataURL("image/png").replace("image/png", 'image/octet-stream')
            // const path = randomString(12)
            // window.localStorage.setItem(path, image)
            // console.log(`saved ${path}`)


        }


        let showSplit = false;
        let splitOffset = 0;

        let countdownActive = false;

        function startCountdown() {
            if (countdownActive) return;
            countdownActive = true;

            const overlay = document.getElementById('countdownOverlay');
            const numEl = document.getElementById('countdownNumber');
            overlay.classList.add('visible');

            let count = 3;
            numEl.textContent = count;

            const tick = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(tick);
                    overlay.classList.remove('visible');
                    countdownActive = false;
                    saveImage();
                } else {
                    numEl.textContent = count;
                }
            }, 1000);
        }

        function randomString(length) {
            var result = '';
            for (var i = length; i > 0; --i) result += chars[Math.floor(Math.random() * chars.length)];
            return result;
        }

        document.onkeydown = (e) => {
            console.log(e.key)
            switch (e.key) {
                // case "0":
                //   filter = "none"
                //   break;
                case "a":
                    filter = "canny"
                    break;
                case "s":
                    filter = "gray"
                    break;
                case "d":
                    filter = "cartoon"
                    break;
                case "p":
                    filter = "pixelate"
                    break;
                case "r":
                    showSplit = !showSplit;
                    if (!showSplit) splitOffset = 0;
                    break;
                case "0":
                    if (showSplit) splitOffset = 0;
                    break;
                case "1":
                    if (showSplit) splitOffset += pixelSize;
                    else pixelSize = 5;
                    break;
                case "2":
                    if (showSplit) splitOffset += pixelSize * 2;
                    else pixelSize = 10;
                    break;
                case "3":
                    if (showSplit) splitOffset += pixelSize * 3;
                    else pixelSize = 15;
                    break;
                case "4":
                    if (showSplit) splitOffset += pixelSize * 4;
                    else pixelSize = 20;
                    break;
                case "5":
                    if (showSplit) splitOffset += pixelSize * 5;
                    break;
                case "6":
                    if (showSplit) splitOffset += pixelSize * 6;
                    break;
                case "7":
                    if (showSplit) splitOffset += pixelSize * 7;
                    break;
                case "8":
                    if (showSplit) splitOffset += pixelSize * 8;
                    break;
                case "9":
                    if (showSplit) splitOffset += pixelSize * 9;
                    break;
                case "ArrowUp":
                    pixelSize++
                    break;
                case "ArrowDown":
                    if (pixelSize > 1) pixelSize--
                    break;
                case "f":
                    saveImage();
                    break;
                case "Enter":
                    startCountdown();
                    break;
            }
        }
