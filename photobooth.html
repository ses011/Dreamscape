    <script type="text/javascript">

                width = video.videoWidth;
                // video.setAttribute('width', width);
                // video.setAttribute('height', height);
                // console.log(video)
                streaming = true;
                vc = new cv.VideoCapture(video);

                src = new cv.Mat(video.height, video.width, cv.CV_8UC4);
                dst = new cv.Mat(video.height, video.width, cv.CV_8UC4);
                filter = "none"

                setTimeout(processVideo, 0);
            };
        }


        function gray(src) {
            cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY);
            cv.cvtColor(dst, dst, cv.COLOR_GRAY2RGBA);

            // cv.flip(dst, 1, dst);
            return dst;
        }

            dst = src;
            return src;
        }

            //     let hue = (angle + Math.PI) / (Math.PI * 2) * 360

        async function pixelate(src) {
            let newWidth = Math.floor(src.cols / pixelSize);
            let newHeight = Math.floor(src.rows / pixelSize);
            let dsize = new cv.Size(newWidth, newHeight);

            // resize smaller
            let temp = new cv.Mat(dsize, cv.CV_8SC4)
            await cv.resize(src, temp, dsize, 0, 0, cv.INTER_LINEAR);
            // copy back to src


            // rescale up
            // copy back to src
            // create new dst for upscaling
            await cv.resize(temp, dst, new cv.Size(video.width, video.height), 0, 0, cv.INTER_NEAREST);
            temp.delete();

            return dst;
        }

        async function cartoon(src) {
            let temp = new cv.Mat(new cv.Size(video.width, video.height), cv.CV_8SC4);
            let edges = new cv.Mat(new cv.Size(video.width, video.height), cv.CV_8SC4);

            cv.cvtColor(src, temp, cv.COLOR_RGBA2GRAY);
            await cv.medianBlur(temp, temp, 3);

            await cv.adaptiveThreshold(
                temp,
                edges,
                255,
                cv.ADAPTIVE_THRESH_MEAN_C,
                cv.THRESH_BINARY,
                9,
                5
            );

            await cv.GaussianBlur(src, temp, new cv.Size(3, 3), 0);
            await cv.cvtColor(edges, edges, cv.COLOR_GRAY2RGBA);

            await cv.bitwise_and(src, edges, dst);

            temp.delete();
            edges.delete();

            return dst;
        }

        function colorize(src) {
            const intensity = 30;

            let gray = new cv.Mat();
            let dst = src.clone();

            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

            for (let i = 0; i < gray.data.length; i++) {
                let v = gray.data[i];

                let r = Math.max(0, Math.min(255, 2 * v - 128));
                let g = Math.max(0, Math.min(255, 2 * (255 - Math.abs(v - 128))));
                let b = Math.max(0, Math.min(255, 255 - 2 * v));

                let idx = i * 4;

                dst.data[idx] = dst.data[idx] * (1 - intensity) + r * intensity;
                dst.data[idx + 1] = dst.data[idx + 1] * (1 - intensity) + g * intensity;
                dst.data[idx + 2] = dst.data[idx + 2] * (1 - intensity) + b * intensity;
            }

            gray.delete();
            return dst;
        }


        async function processVideo() {
            if (!streaming) return;

            let begin = Date.now();

            // stats.begin();
            vc.read(src);

            switch (filter) {
                case "none":
                    applyOperation(passthrough);
                    break;
                case "gray":
                    src = applyOperation(gray);
                    if (doPixelate) await applyOperation(pixelate);
                    break;
                case "canny":
                    await applyOperation(cannyRainbow);
                    break;
                case "cartoon":
                    src = await applyOperation(cartoon);
                    if (doPixelate) await applyOperation(pixelate);
                    break;
                default:
                    applyOperation(passthrough);
            }
            cv.imshow(outputCanvas, dst);

            let delay = 1000 / FPS - (Date.now() - begin);
            setTimeout(processVideo, delay);
        }

        function applyOperation(operation) {
            return operation(src); // Execute the OpenCV function
        };

        function saveImage() {
            outputCanvas.toBlob((blob) => {
                let url = URL.createObjectURL(blob)
                const a = document.createElement('a')
                a.href = url;
                a.download = url
                document.body.appendChild(a)
                a.click()
                document.body.removeChild(a)
            });

            // TODO - send image to  API


            // const image = outputCanvas.toDataURL("image/png").replace("image/png", 'image/octet-stream')
            // const path = randomString(12)
            // window.localStorage.setItem(path, image)
            // console.log(`saved ${path}`)
        }

        function randomString(length) {
            var result = '';
            for (var i = length; i > 0; --i) result += chars[Math.floor(Math.random() * chars.length)];
            return result;
        }

        document.onkeydown = (e) => {
            console.log(e.key)
            switch (e.key) {
                // case "0":
                //   filter = "none"
                //   break;
                case "a":
                    filter = "canny"
                    break;
                case "s":
                    filter = "gray"
                    break;
                case "d":
                    filter = "cartoon"
                    break;
                case "p":
                    doPixelate = !doPixelate;
                    break;
                case "1":
                    pixelSize = 5
                    break;
                case "2":
                    pixelSize = 10
                    break;
                case "3":
                    pixelSize = 15
                    break;
                case "4":
                    pixelSize = 20
                    break;
                case "ArrowUp":
                    pixelSize += 0.45
                    break;
                case "ArrowDown":
                    if (pixelSize > 1.45) pixelSize -= 0.45
                    break;
                case "Enter":
                    saveImage();
                    break;
            }
        }
