        function cartoon(src) {
            let gray = new cv.Mat();
            let edges = new cv.Mat();
            let temp = new cv.Mat();

            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            cv.medianBlur(gray, gray, 3);

            cv.adaptiveThreshold(
                gray,
                edges,
                255,
                cv.ADAPTIVE_THRESH_MEAN_C,
                cv.THRESH_BINARY,
                9,
                5
            );

            cv.GaussianBlur(src, temp, new cv.Size(3, 3), 0);
            cv.cvtColor(edges, edges, cv.COLOR_GRAY2RGBA);

            cv.bitwise_and(src, edges, dst);

            // gray.delete();
            // edges.delete();


            return dst;
        }

        function colorize(src) {
            const intensity = 30;

            let gray = new cv.Mat();
            let dst = src.clone();

            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

            for (let i = 0; i < gray.data.length; i++) {
                let v = gray.data[i];

                let r = Math.max(0, Math.min(255, 2 * v - 128));
                let g = Math.max(0, Math.min(255, 2 * (255 - Math.abs(v - 128))));
                let b = Math.max(0, Math.min(255, 255 - 2 * v));

                let idx = i * 4;

                dst.data[idx] = dst.data[idx] * (1 - intensity) + r * intensity;
                dst.data[idx + 1] = dst.data[idx + 1] * (1 - intensity) + g * intensity;
                dst.data[idx + 2] = dst.data[idx + 2] * (1 - intensity) + b * intensity;
            }

            gray.delete();
            return dst;
        }

        async function processVideo() {
            if (!streaming) return;

            let begin = Date.now();

            // stats.begin();
            vc.read(src);

            switch (filter) {
                case "none":
                    applyOperation(passthrough);
                    break;
                case "gray":
                    applyOperation(gray);
                    break;
                case "canny":
                    applyOperation(cannyRainbow);
                    break;
                case "cartoon":
                    applyOperation(cartoon);
                    break;
                case "pixelate":
                    src = applyOperation(cartoon);
                    applyOperation(pixelate);
                    break;
                default:
                    applyOperation(passthrough)

            }
            cv.imshow(outputCanvas, dst);


            let delay = 1000 / FPS - (Date.now() - begin);
            setTimeout(processVideo, delay);
        }


        function applyOperation(operation) {
            return operation(src); // Execute the OpenCV function
        };
