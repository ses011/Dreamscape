        function onOpenCvReady() {
            cv['onRuntimeInitialized'] = () => {
                console.log("OpenCV.js is ready.");
                cvReady = true;

                video = document.getElementById("videoInput");
                console.log(video)
                navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                    .then(function (stream) {
                        video.srcObject = stream;
                        video.play();
                    })
                    .catch(function (err) {
                        console.log("An error occurred! " + err);
                    });

                height = video.videoHeight;
                width = video.videoWidth;
                streaming = true;
                vc = new cv.VideoCapture(video);

                src = new cv.Mat(video.height, video.width, cv.CV_8UC4);
                dst = new cv.Mat(video.height, video.width, cv.CV_8UC4);
                holding = new cv.Mat(video.width, video.height, cv.CV_8UC4)
                filter = "none"


                setTimeout(processVideo, 0);
            };
        }

            cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY);
            cv.cvtColor(dst, dst, cv.COLOR_GRAY2RGBA);

            // cv.flip(dst, 1, dst);
            return dst;
        }

        function passthrough(src) {
            dst = src;
            return dst;
        }

        async function pixelate(src) {
            let newWidth = Math.floor(src.cols / pixelSize);
            let newHeight = Math.floor(src.rows / pixelSize);
            let dsize = new cv.Size(newWidth, newHeight);


            // resize smaller
            let temp = new cv.Mat(dsize, cv.CV_8SC4)
            await cv.resize(src, temp, dsize, 0, 0, cv.INTER_LINEAR);
            // copy back to src
            await cv.resize(temp, dst, new cv.Size(src.cols, src.rows), 0, 0, cv.INTER_NEAREST);

            // rescale up

            // For each pixel in the scaled down image
            // for (let i = 0; i < newHeight; i++) {
            //     for (let j = 0; j < newWidth; j++) {
            //         sample = temp.ucharPtr(i, j);
            //         // For each pixel in the increased size range
            //         for (let x = pixelSize * i; x < pixelSize * (i + 1) & x < newHeight; x++) {
            //             for (let y = pixelSize * j; y < pixelSize * (j + 1) & y < newWidth; y++) {
            //                 let pixel = dst.ucharPtr(x, y);
            //                 // Black gutter

            //                     pixel[0] = 255

            //                     pixel[2] = 255

            //                 else {
            //                     pixel = sample;

            temp.delete();

        async function cartoon(src) {
            let temp = new cv.Mat(new cv.Size(video.width, video.height), cv.CV_8SC4);
            let edges = new cv.Mat(new cv.Size(video.width, video.height), cv.CV_8SC4);

            cv.cvtColor(src, temp, cv.COLOR_RGBA2GRAY);
            await cv.medianBlur(temp, temp, 3);

            await cv.adaptiveThreshold(
                temp,
                edges,
                255,
                cv.ADAPTIVE_THRESH_MEAN_C,
                cv.THRESH_BINARY,
                9,
                5
            );

            await cv.GaussianBlur(src, temp, new cv.Size(3, 3), 0);
            await cv.cvtColor(edges, edges, cv.COLOR_GRAY2RGBA);

            cv.bitwise_and(src, edges, dst);

            edges.delete();
            temp.delete();

            return dst;
        }

        async function processVideo() {
            if (!streaming) return;

            let begin = Date.now();

            // stats.begin();
            vc.read(src);

            switch (filter) {

                case "gray":
                    src = applyOperation(gray);
                    if (doPixelate) await applyOperation(pixelate);
                    break;
                case "canny":
                    await applyOperation(cannyRainbow);
                    break;
                case "cartoon":
                    src = await applyOperation(cartoon);
                    if (doPixelate) await applyOperation(pixelate);
                    break;
                case "none":

                    applyOperation(passthrough)
                    if (doPixelate) await applyOperation(pixelate);
                    break;
                default:
                    break;
            }

            cv.imshow(outputCanvas, dst);

            ctx = outputCanvas.getContext('2d');
            ctx.fillStyle = `rgba(${thresholdR * 10}, ${thresholdG * 10}, ${thresholdB * 10}, 0.7)`;
            ctx.fillRect(0, 0, video.width, video.height);

            let delay = 1000 / FPS - (Date.now() - begin);
            setTimeout(processVideo, delay);
        }

        async function applyOperation(operation) {
            return operation(src); // Execute the OpenCV function

        };

        function saveImage() {
            outputCanvas.toBlob((blob) => {
                let url = URL.createObjectURL(blob)
                const a = document.createElement('a')
                a.href = url;
                a.download = url
                document.body.appendChild(a)
                a.click()
                document.body.removeChild(a)
            });

            // TODO - send image to  API

            // const image = outputCanvas.toDataURL("image/png").replace("image/png", 'image/octet-stream')
            // const path = randomString(12)
            // window.localStorage.setItem(path, image)
            // console.log(`saved ${path}`)
        }

        function randomString(length) {
            var result = '';
            for (var i = length; i > 0; --i) result += chars[Math.floor(Math.random() * chars.length)];
            return result;
        }

        document.onkeydown = (e) => {
            if (!isNaN(e.key)) {
                num = e.key.toString();
                console.log(num)
            }
            switch (e.key) {
                case "n":
                    filter = "none"
                    break;
                case "d":
                    filter = "cartoon"
                    break;
                case "p":
                    doPixelate = !doPixelate;
                    break;
                case "ArrowLeft":
                    if (gutterSize > 1) gutterSize--;
                    break;
                case "ArrowRight":
                    if (gutterSize < pixelSize - 3) gutterSize++;
                    break;
                case "ArrowUp":
                    pixelSize += 0.45
                    break;
                case "ArrowDown":
                    if (pixelSize > 1.45) pixelSize -= 0.45
                    break;
                case "r":
                    if (!isNaN(num)) thresholdR = num;
                    break;
                case "g":
                    if (!isNaN(num)) thresholdG = num;
                    break;
                case "b":
                    if (!isNaN(num)) thresholdB = num;
                    break;
                case "Enter":
                    saveImage();
                    break;
            }
        }
